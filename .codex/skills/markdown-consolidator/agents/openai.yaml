interface:
  display_name: "Lossless Markdown Consolidator v6"
  short_description: "Reviewed consolidation into standalone or repository-integrated notes"
  default_prompt: "Consolidate the selected Markdown evidence without information loss. Keep the main agent orchestration-only and execute each semantic stage as producer subagent, reconciliation, independent stage review, deterministic validation, then advance or retry. Use standalone mode for one self-contained publication. When integrating into an existing note repository, use the installed note-home-finder skill before outlining, preserve destination notes and context boundaries, then use the installed markdown-link-normalizer in a disposable repository shadow before publishing normalized notes. Never cite or link disposable evidence files."

policy:
  allow_implicit_invocation: true
