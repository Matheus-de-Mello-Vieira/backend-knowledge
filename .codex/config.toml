model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

[mcp_servers.file-system]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "."]

[mcp_servers.qmd]
command = "npx"
args = ["-y", "@tobilu/qmd", "mcp"]

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/bin/python3 .codex/hooks/python_interceptor.py"
timeout = 30
statusMessage = "Validating Python environment"