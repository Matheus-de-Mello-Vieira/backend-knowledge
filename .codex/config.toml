model = "gpt-5.4"
model_reasoning_effort = "medium"
model_instructions_file = "model_instructions.md"

[mcp_servers.qmd]
command = "npx"
required = true
args = ["-y", "@tobilu/qmd", "mcp"]

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/bin/python3 .codex/hooks/python_interceptor.py"
timeout = 30
statusMessage = "Validating Python environment"
