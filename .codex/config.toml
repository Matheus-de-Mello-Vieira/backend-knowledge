model = "gpt-5.4"
model_reasoning_effort = "medium"
model_instructions_file = "model_instructions.md"
personality = "none"

[mcp_servers.qmd]
command = "npx"
required = true
args = ["-y", "@tobilu/qmd", "mcp"]

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "uv run .codex/hooks/python_interceptor.py"
timeout = 30
statusMessage = "Validating Python environment"

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "uv run .codex/hooks/obsidian_active_file.py"
timeout = 5